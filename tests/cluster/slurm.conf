# Baked into the image, not generated at runtime, so what the cluster is
# running is reviewable in git rather than buried in a shell heredoc.
#
# CPUs and memory are pinned rather than detected: detecting them would make
# every scheduling test depend on the host's core count, which is a fine way to
# get results that differ between a laptop and CI.
ClusterName=tether
SlurmctldHost=cluster
SlurmUser=slurm

# proctrack/linuxproc, not cgroup: the container cannot own a cgroup hierarchy.
ProctrackType=proctrack/linuxproc
TaskPlugin=task/none
SelectType=select/cons_tres
SelectTypeParameters=CR_CPU

# Trust this file over what slurmd detects, so a hardware mismatch does not
# park the node in INVALID_REG.
SlurmdParameters=config_overrides

SlurmctldPidFile=/run/slurmctld.pid
SlurmdPidFile=/run/slurmd.pid
SlurmdSpoolDir=/var/spool/slurmd
StateSaveLocation=/var/spool/slurmctld
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log

# How long slurmctld keeps a finished job in memory for `scontrol show job`.
# Past this, the job is only in the accounting database -- which is exactly the
# squeue -> sacct handoff tether's completion detection has to cope with.
MinJobAge=300

# -- accounting -------------------------------------------------------------
# Without this, `sacct` reports "Slurm accounting storage is disabled" and the
# killed-job cases (scancel, timeout, OOM) have no second source at all.
# AccountingStorageEnforce is deliberately left unset: enforcing associations
# would reject jobs from any user not registered with sacctmgr, which is a
# realistic cluster policy but a needless trap in a test rig.
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=localhost
JobAcctGatherType=jobacct_gather/linux
JobAcctGatherFrequency=30

NodeName=cluster CPUs=4 Boards=1 SocketsPerBoard=1 CoresPerSocket=4 \
    ThreadsPerCore=1 RealMemory=1024 State=UNKNOWN
PartitionName=main Nodes=ALL Default=YES MaxTime=INFINITE State=UP
PartitionName=debug Nodes=ALL MaxTime=00:05:00 State=UP
