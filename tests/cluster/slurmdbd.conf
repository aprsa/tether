# Accounting daemon. Lives in the same container as everything else: this image
# emulates one computing resource, not a microservice estate, and keeping it
# together means munge's shared secret never has to leave the container.
#
# The password is a throwaway for a loopback-only test database. It is in git on
# purpose -- there is nothing here worth protecting, and a generated one would
# only have to be plumbed somewhere.
DbdHost=localhost
SlurmUser=slurm
DebugLevel=info
LogFile=/var/log/slurm/slurmdbd.log
PidFile=/run/slurmdbd.pid

StorageType=accounting_storage/mysql
StorageHost=localhost
StorageLoc=slurm_acct_db
StorageUser=slurm
StoragePass=tether-rig
